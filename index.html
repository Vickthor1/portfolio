<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor Oliveira Portfólio</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/particles.css">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div id="preload">
        <div class="preload-content">
            <div class="spinner"></div>
            <p>Carregando...</p>
        </div>
    </div>

    <div id="hero" class="hero-section">
        <div class="particles" id="particles"></div>
        <div class="hero-content">
            <h1 class="hero-title">Victor Oliveira</h1>
            <p class="hero-subtitle" id="typing-text"></p>
            <button class="explore-btn" onclick="scrollToMenu()">Explorar Projetos</button>
        </div>
    </div>

    <!-- Elementos HUD -->
    <div class="hud-elements">
        <div class="hud-bar-top"></div>
        <div class="hud-bar-bottom"></div>
        <div class="hud-bar-left"></div>
        <div class="hud-bar-right"></div>
        <div class="status-indicator">SISTEMA ONLINE</div>
        <div class="system-info">
            <div>PORTFÓLIO v2.0</div>
            <div>STATUS: ATIVO</div>
            <div>LOCAL: BRASIL</div>
        </div>
    </div>

    <!-- Scanlines -->
    <div class="scanlines"></div>

    <header class="header">
        <nav>
            <a href="index.html">Início</a>
            <a href="projects.html">Projetos</a>
            <a href="about.html">Sobre</a>
            <a href="contact.html">Contato</a>
        </nav>
        <div class="theme-toggle">
            <button id="theme-btn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div id="side-panel" class="side-panel">
        <div class="panel-header">
            <h2 id="panel-title" class="panel-title"></h2>
            <p id="panel-subtitle" class="panel-subtitle"></p>
        </div>
        <div class="tech-details">
            <div class="detail-item">
                <div class="detail-label">Descrição</div>
                <div class="detail-value" id="panel-description"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Nível de Experiência</div>
                <div class="detail-value">
                    <div class="level-bar" id="level-bar"></div>
                </div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Projetos Relacionados</div>
                <div class="detail-value" id="related-projects"></div>
            </div>
        </div>
        <button class="close-panel" onclick="closePanel()" aria-label="Fechar painel">×</button>
    </div>

    <section id="projects" class="projects-section">
        <h2>Projetos</h2>
        <div id="projects-grid" class="projects-grid"></div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Victor Hugo Fassini de Oliveira. Todos os direitos reservados.</p>
            <div class="social-links">
                <a href="https://github.com/Vickthor1" target="_blank">GitHub</a>
                <a             href="https://www.linkedin.com/in/victor-hugo-fassini-de-oliveira-457653207/" target="_blank">LinkedIn</a>
                <a href="mailto:victorfassini21@gmail.com">Email</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/scripts.js"></script>
</body>
</html>
